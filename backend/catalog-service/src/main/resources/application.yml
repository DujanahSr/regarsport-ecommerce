server:
  port: 8087

spring:
  application:
    name: catalog-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/regarsport_catalog
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: CatalogHikariCP

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

  cache:
    type: redis

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  storage:
    provider: ${STORAGE_PROVIDER:cloudinary}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:urcpwhxf}
    api-key: ${CLOUDINARY_API_KEY:496176863661411}
    api-secret: ${CLOUDINARY_API_SECRET:7aH2YcoNZy6tQWwdwP_HOEzYMLE}
  upload:
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}
